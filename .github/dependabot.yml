version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      timezone: Asia/Tokyo
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      timezone: Asia/Tokyo
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
